<!doctype html>
<html lang="en-US">
  <head>
    <title>Profile Card</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta
      name="description"
      content="Profile Card Creation using HTML and CSS"
    />
    <link rel="stylesheet" type="text/css" href="Profile_Card.css" />
  </head>
  <body>
    <div class="profile-card">
      <header>
        <h1 id="profile-name">Kiruthiga Natarajan</h1>
        <img
          id="profile-image"
          src="https://cdn.pixabay.com/photo/2024/07/14/14/42/woman-8894656_1280.jpg"
          alt="profile image"
        />
        <h3 id="profile-role">Role : Senior Full Stack Developer</h3>
      </header>
      <main>
        <section class="section">
          <h4>Short Bio:</h4>
          <p id="bio">
            I have total 7+YOE in IT, earlier worked in Peoplesoft and as SAP
            ABAP Developer. Due to my passion in web development, I learned MERN
            Stack on my own and learning Stack more deeper.
          </p>
        </section>
      </main>
      <footer>
        <button type="button" id="contact">Contact</button>
      </footer>
    </div>
  </body>
</html>
