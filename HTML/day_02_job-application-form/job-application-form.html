<!doctype html>
<html lang="en-US">
  <head>
    <title>Job Application form</title>
    <meta charset="UTF-8" />
    <meta name="description" content="Job Application form" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      table,
      td,
      th {
        border: 1px solid black;
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <main>
      <form>
        <fieldset>
          <legend>Job Application Form</legend>
          <label for="full_name">Full Name</label>
          <br />
          <input
            id="full_name"
            type="text"
            placeholder="Kirthi"
            name="full_name"
          />
          <br />

          <label for="email">Email</label>
          <br />
          <input
            id="email"
            type="email"
            placeholder="abc@gmail.com"
            required
            name="email"
          />
          <br />

          <label for="phone_no">Phone Number</label>
          <br />
          <input
            id="phone_no"
            type="tel"
            pattern="[1-9]{1}[0-9]{9}"
            placeholder="9090909090"
            required
            maxlength="10"
            name="phone_no"
          />
          <br />

          <label for="dob">Date of Birth</label>
          <br />
          <input id="dob" type="date" placeholder="2025-09-09" name="dob" />
          <br />

          <p>Gender</p>
          <input id="male" type="radio" name="gender" value="male" /><label
            for="male"
            >Male</label
          >
          <input id="female" type="radio" name="gender" value="female" /><label
            for="female"
            >Female</label
          >
          <input id="others" type="radio" name="gender" value="others" /><label
            for="others"
            >Others</label
          >
          <br />

          <p>Skills</p>
          <input id="HTML" type="checkbox" name="skills" value="html" /><label
            for="HTML"
            >HTML</label
          >
          <input id="CSS" type="checkbox" name="skills" value="css" /><label
            for="CSS"
            >CSS</label
          >
          <input id="JS" type="checkbox" name="skills" value="js" /><label
            for="JS"
            >JS</label
          >
          <br />

          <label for="resume">Upload Resume</label>
          <br />
          <input id="resume" type="file" name="resume" />
          <br />

          <label for="experience">Experience</label>
          <br />
          <textarea
            id="experience"
            placeholder="Please Enter your years of experience...."
            rows="10"
            cols="20"
            name="experience"
          ></textarea>
          <br />
          <button type="submit">Submit</button>
          <button type="reset">Reset</button>
        </fieldset>
      </form>
    </main>
    <br />
    <br />
    <table>
      <caption>
        Skills table
      </caption>
      <thead>
        <tr>
          <th>Skill</th>
          <th>Experience</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>HTML</td>
          <td>Beginner</td>
        </tr>
        <tr>
          <td>CSS</td>
          <td>Beginner</td>
        </tr>
        <tr>
          <td>Javascript</td>
          <td>Learning</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
